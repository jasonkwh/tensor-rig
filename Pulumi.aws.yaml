config:
  tensor-rig:cloud: aws
  tensor-rig:location: ap-southeast-2
  tensor-rig:storageName: tensor-rig-storage-au
  tensor-rig:storageDeleteAfterDays: 7
  tensor-rig:storageForceDestroy: false
  tensor-rig:storageVersioning: false
  tensor-rig:storageUniformAccess: true
  tensor-rig:storagePublicAccess: enforced
  tensor-rig:storageClass: standard
  tensor-rig:storageSoftDelete: false
  tensor-rig:instanceName: tensor-rig-instance-au
  tensor-rig:instanceMachineType: g4dn.xlarge
  tensor-rig:instanceBootDiskImage: /aws/service/deeplearning/ami/x86_64/oss-nvidia-driver-gpu-pytorch-2.14-ubuntu-26.04/latest/ami-id
  tensor-rig:instanceBootDiskType: gp3
  tensor-rig:instanceNetwork: default
  tensor-rig:instanceAssignPublicIP: true
  tensor-rig:instanceOnHostMaintenance: terminate
  tensor-rig:instanceProvisioningModel: spot
