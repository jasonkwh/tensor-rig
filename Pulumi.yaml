name: tensor-rig
runtime: go
description: Personal AI training rig
config:
  cloud:
    type: string
    description: Cloud provider to deploy. Allowed values are gcp and aws.
  location:
    type: string
    description: Location for the bucket and instance.
  storageName:
    type: string
    description: Bucket name.
  storageForceDestroy:
    type: boolean
    description: Delete the bucket even when it still contains objects.
    default: false
  storageDeleteAfterDays:
    type: integer
    description: Delete bucket objects after this many days. Zero disables the rule.
    default: 7
  storageVersioning:
    type: boolean
    description: Enable bucket versioning.
    default: false
  storageUniformAccess:
    type: boolean
    description: Enable uniform bucket-level access.
    default: true
  storagePublicAccess:
    type: string
    description: Public access prevention. Allowed values are enforced, inherited, and off.
    default: enforced
  storageClass:
    type: string
    description: Storage class. Allowed values are standard, infrequent, cold, and archive.
    default: standard
  storageSoftDelete:
    type: boolean
    description: Enable soft delete.
    default: false
  instanceName:
    type: string
    description: Instance name.
  instanceLoginUser:
    type: string
    description: Login account cloud-init adds on first boot (sudo). Not the image OS user—set this to match your workstation username for tailscale ssh without user@host.
    default: jasonkwh
  instanceZone:
    type: string
    description: Zone suffix, such as a.
    default: a
  instanceMachineType:
    type: string
    description: Instance machine type.
  instanceBootDiskImage:
    type: string
    description: Boot disk image or AMI parameter name.
  instanceBootDiskSizeGb:
    type: integer
    description: Boot disk size in GB.
    default: 100
  instanceBootDiskType:
    type: string
    description: Boot disk type.
  instanceNetwork:
    type: string
    description: VPC network or subnet. Use default for the cloud default network.
    default: default
  instanceNicType:
    type: string
    description: GCP only. Network interface type, such as VIRTIO_NET. AWS ignores this.
  instanceAssignPublicIP:
    type: boolean
    description: Assign a public IP address.
  instanceRestrictPublicIngress:
    type: boolean
    description: Block inbound TCP from the public internet and allow Tailscale UDP 41641 only. Use Tailscale SSH to connect.
    default: true
  instanceAcceleratorType:
    type: string
    description: GCP only. Guest accelerator type, such as nvidia-tesla-t4. AWS ignores this.
  instanceAcceleratorCount:
    type: integer
    description: GCP only. Guest accelerator count. AWS ignores this.
  instanceOnHostMaintenance:
    type: string
    description: Host maintenance action. GCP uses TERMINATE. AWS spot uses TERMINATE, STOP, or HIBERNATE.
  instanceProvisioningModel:
    type: string
    description: Provisioning model. Use SPOT.
