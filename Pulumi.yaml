name: tensor-rig
runtime: go
description: Personal AI training rig
config:
  cloud:
    type: string
    description: Cloud provider to deploy. Allowed values are gcp and aws.
    default: gcp
  location:
    type: string
    description: Location for the bucket and instance.
    default: australia-southeast1
  storageName:
    type: string
    description: Bucket name.
    default: tensor-rig-storage-au
  storageForceDestroy:
    type: boolean
    description: Delete the bucket even when it still contains objects.
    default: false
  storageDeleteAfterDays:
    type: integer
    description: Delete bucket objects after this many days. Zero disables the rule.
    default: 7
  storageVersioning:
    type: boolean
    description: Enable bucket versioning.
    default: false
  storageUniformAccess:
    type: boolean
    description: Enable uniform bucket-level access.
    default: true
  storagePublicAccess:
    type: string
    description: Public access prevention. Allowed values are enforced, inherited, and off.
    default: enforced
  storageClass:
    type: string
    description: Storage class. Allowed values are standard, infrequent, cold, and archive.
    default: standard
  storageSoftDelete:
    type: boolean
    description: Enable soft delete.
    default: false
  instanceName:
    type: string
    description: Instance name.
  instanceZone:
    type: string
    description: Zone suffix, such as a.
  instanceMachineType:
    type: string
    description: Instance machine type.
  instanceBootDiskImage:
    type: string
    description: Boot disk image or AMI parameter name.
  instanceBootDiskSizeGb:
    type: integer
    description: Boot disk size in GB.
    default: 100
  instanceBootDiskType:
    type: string
    description: Boot disk type.
  instanceNetwork:
    type: string
    description: VPC network or subnet. Use default for the cloud default network.
  instanceNicType:
    type: string
    description: GCP network interface type.
  instanceAssignPublicIP:
    type: boolean
    description: Assign a public IP address.
  instanceAcceleratorType:
    type: string
    description: GCP guest accelerator type.
  instanceAcceleratorCount:
    type: integer
    description: GCP guest accelerator count.
  instanceOnHostMaintenance:
    type: string
    description: Host maintenance action. GCP uses TERMINATE. AWS spot uses terminate, stop, or hibernate.
  instanceProvisioningModel:
    type: string
    description: Provisioning model. GCP uses SPOT. AWS uses spot.
